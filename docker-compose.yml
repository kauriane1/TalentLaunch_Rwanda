# Legacy Docker compose file. Deployment now targets Render / PostgreSQL.
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: talentlaunch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: talentlaunch
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: talentlaunch-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: talentlaunch
      DB_USER: user
      DB_PASSWORD: userpassword123
      JWT_SECRET: supersecretkey123
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 10
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./Back-end:/app
      - /app/node_modules
    working_dir: /app

  frontend:
    image: nginx:alpine
    container_name: talentlaunch-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./Front-end:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mysql-data:
